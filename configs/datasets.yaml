  - id: kritikseth36
    name: Fruit and Vegetable Image Recognition
    url: https://www.kaggle.com/datasets/Kritikseth/fruit-and-vegetable-image-recognition/
    # Versión fijada para que todo el equipo use exactamente los mismos archivos.
    kaggle_handle: kritikseth/fruit-and-vegetable-image-recognition/versions/8
    path: data/raw/kritikseth36
    role: trainable
    enabled: true
    label_from: parent
    split_aliases:
      train: [train, training]
      validation: [val, valid, validation]
      test: [test, testing]

  - id: fruits_youssef
    name: Fruit and Vegetables Classification
    url: https://www.kaggle.com/datasets/youssefsalahzakria/fruit-and-vegetables-classification
    # Versión 5: 72,000+ imágenes, 50 categorías, aproximadamente 5.4 GB.
    kaggle_handle: youssefsalahzakria/fruit-and-vegetables-classification/versions/5
    path: data/raw/fruits_youssef
    role: trainable
    enabled: true
    label_from: parent
    split_aliases:
      train: [train, training]
      validation: [val, valid, validation]
      test: [test, testing]

  - id: lvis_fruits_vegetables
    name: LVIS Fruits And Vegetables
    url: https://huggingface.co/datasets/henningheyen/LVIS_Fruits_And_Vegetables
    # Commit fijado para que todos descarguen exactamente los mismos archivos.
    huggingface_repo: henningheyen/LVIS_Fruits_And_Vegetables
    huggingface_revision: 51362ad3532292d29e63f9e46c2cd33945ffe6b5
    download_path: data/raw/lvis_fruits_vegetables
    # `prepare-lvis` crea recortes por caja sin modificar los originales.
    path: data/derived/lvis_fruits_vegetables
    allow_patterns:
      - images/**
    # Evita miles de solicitudes HTTP separadas para etiquetas diminutas.
    huggingface_git_metadata_paths:
      - labels
      - data.yaml
      - README.md
    download_workers: 8
    role: trainable
    enabled: true
    label_from: parent
    split_aliases:
      train: [train, training]
      validation: [val, valid, validation]
      test: [test, testing]

  - id: grocery_store
    name: Grocery Store Dataset (Klasson et al.)
    url: https://github.com/marcusklasson/GroceryStoreDataset
    # 5,125 fotografías reales de teléfono en supermercados (Fruit, Vegetables y Packages).
    git_repo: https://github.com/marcusklasson/GroceryStoreDataset.git
    # Commit fijado: evita que una actualización del repositorio cambie el experimento.
    git_revision: fc80ba90f803d79d0383df52c5a4ac5de99ff6fc
    git_include_paths:
      - dataset/train
      - dataset/val
      - dataset/test
      - dataset/classes.csv
    path: data/raw/grocery_store
    role: trainable
    enabled: true
    label_from: parent
    split_aliases:
      train: [train, training]
      validation: [val, valid, validation]
      test: [test, testing]

  - id: vegetable_ahmed
    name: Vegetable Image Dataset (Ahmed et al.)
    url: https://www.kaggle.com/datasets/misrakahmed/vegetable-image-dataset
    # 21,000 imágenes en 15 categorías (6 verduras botánicas y 9 frutos culinarios).
    # Versión 1 (571,741,740 bytes, CC BY-SA 4.0).
    kaggle_handle: misrakahmed/vegetable-image-dataset/versions/1
    path: data/raw/vegetable_ahmed
    role: trainable
    enabled: true
    label_from: parent
    split_aliases:
      train: [train, training]
      validation: [val, valid, validation]
      test: [test, testing]

  - id: google_shared
    name: Dataset compartido por Google
    url: https://share.google/jp8Kra6Z0zI7dGpQf
    path: data/raw/google_shared
    role: trainable
    enabled: false
    label_from: parent
    split_aliases:
      train: [train, training]
      validation: [val, valid, validation]
      test: [test, testing]

  # Fotos del equipo que sí pueden participar en entrenamiento.
  - id: team_photos_train
    name: Fotografías del equipo para entrenamiento
    path: data/raw/team_photos_train
    role: trainable
    enabled: true
    # El feedback de la interfaz nunca participa en validation ni test.
    fixed_split: train
    label_from: parent
    split_aliases: {}
  # Este conjunto se congela como prueba externa y no se mezcla con train.
  - id: team_photos
    name: Fotografías del equipo para prueba externa
    path: data/external/team_photos
    role: external
    enabled: true
    label_from: parent
    split_aliases: {}
