[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clasificador-frutas-verduras"
version = "0.5.0"
description = "Pipeline reproducible para clasificación binaria de frutas y verduras."
requires-python = ">=3.10"
dependencies = [
  "ImageHash>=4.3,<5",
  "huggingface-hub>=0.35,<2",
  "joblib>=1.3,<2",
  "kagglehub>=1.0,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scikit-image>=0.23,<1",
  "tabulate>=0.9,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
notebooks = [
  "ipykernel>=6,<8",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
]

[project.scripts]
frutas-data = "frutas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

